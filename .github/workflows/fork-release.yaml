name: Fork Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    name: Build & Push Image + Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: make test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/openclaw-operator:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/openclaw-operator:latest
          labels: |
            org.opencontainers.image.title=openclaw-operator
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Update chart version + appVersion to match tag
          sed -i "s/^version:.*/version: ${VERSION}/" charts/openclaw-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${VERSION}/" charts/openclaw-operator/Chart.yaml

          # Update default image repo in values.yaml
          sed -i "s|repository: ghcr.io/openclaw-rocks/openclaw-operator|repository: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/openclaw-operator|" charts/openclaw-operator/values.yaml

          helm package charts/openclaw-operator --version "${VERSION}" --app-version "${VERSION}"
          helm push "openclaw-operator-${VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/charts
